<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkShot</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img class="brand-mark" src="../../assets/app-icon.png" alt="" />
          <div>
            <h1>MarkShot</h1>
          </div>
        </div>
        <div class="header-tools">
          <span class="shortcut-chip" id="shortcut-summary"
            >Command + Option + T</span
          >
          <button
            class="icon-button"
            id="open-settings"
            type="button"
            aria-label="快捷键设置"
            title="快捷键设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.18.37.39.72.6 1 .29.38.68.57 1.1.6h.1v4h-.1a1.7 1.7 0 0 0-1.7.4Z"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="editor-panel" aria-label="文本输入">
          <div class="panel-heading">
            <div>
              <h2>文本</h2>
              <p>Markdown / 富文本</p>
            </div>
            <div class="editor-heading-actions">
              <button class="button button-ghost" id="clear-content" type="button">
                清空
              </button>
              <button class="button button-secondary" id="paste-content" type="button">
                粘贴
              </button>
              <button class="button button-primary" id="render-preview" type="button">
                预览
              </button>
            </div>
          </div>

          <textarea
            id="content"
            class="content-editor"
            aria-label="文本或 Markdown"
            placeholder="复制内容后点击“粘贴”，或直接在这里输入…"
            spellcheck="false"
          ></textarea>

        </section>

        <section class="preview-panel" aria-label="图片预览">
          <div class="preview-heading">
            <div>
              <h2>图片预览</h2>
              <p id="preview-meta">等待输入内容</p>
            </div>
            <div class="preview-toolbar">
              <select id="preview-page" aria-label="选择预览页面" hidden></select>
              <button
                class="button button-primary"
                id="copy-preview"
                type="button"
                disabled
              >
                复制图片
              </button>
              <button
                class="button button-secondary"
                id="export-preview"
                type="button"
                disabled
              >
                导出…
              </button>
            </div>
          </div>

          <div class="preview-stage" id="preview-stage">
            <div class="empty-state" id="empty-state">
              <div class="empty-icon" aria-hidden="true">▤</div>
              <h3>粘贴一段内容开始预览</h3>
              <p>图片只保存在内存中</p>
            </div>
            <div id="page-list" class="page-list" aria-live="polite"></div>
          </div>
        </section>

        <aside class="settings-panel" aria-label="图片配置">
          <div class="settings-heading">
            <div>
              <h2>配置</h2>
              <p>自动保存为快捷生成默认值</p>
            </div>
          </div>

          <div class="settings-scroll">
            <section class="config-group">
              <h3>分享场景</h3>
              <div class="choice-grid">
                <label class="choice-card">
                  <input type="radio" name="profile" value="mobile" />
                  <span class="choice-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M10.5 18.5h3"/></svg>
                  </span>
                  <span><b>移动端</b><small>1080 px</small></span>
                </label>
                <label class="choice-card">
                  <input type="radio" name="profile" value="desktop" />
                  <span class="choice-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  </span>
                  <span><b>PC</b><small>1440 px</small></span>
                </label>
              </div>
            </section>

            <section class="config-group appearance-group">
              <h3>颜色主题</h3>
              <div class="choice-grid">
                <label class="choice-card">
                  <input type="radio" name="theme" value="light" />
                  <span class="choice-icon icon-light" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                  </span>
                  <span><b>浅色</b><small>明亮纸张</small></span>
                </label>
                <label class="choice-card">
                  <input type="radio" name="theme" value="dark" />
                  <span class="choice-icon icon-dark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
                  </span>
                  <span><b>深色</b><small>暗色阅读</small></span>
                </label>
              </div>

              <label class="switch-row grouped-switch title-switch">
                <span>
                  <b>图片标题</b>
                  <small>开启后在正文上方显示</small>
                </span>
                <input id="title-enabled" type="checkbox" role="switch" />
              </label>
              <label class="field title-field" id="title-field" hidden>
                <input
                  id="title"
                  type="text"
                  aria-label="图片标题内容"
                  placeholder="例如：项目进展说明"
                />
              </label>
              <label class="switch-row grouped-switch">
                <span>
                  <b>图片页脚</b>
                  <small>显示 MarkShot 和生成时间</small>
                </span>
                <input id="show-footer" type="checkbox" role="switch" />
              </label>
            </section>

            <section class="config-group">
              <h3>背景</h3>
              <div class="choice-grid choice-grid-three">
                <label class="choice-card">
                  <input type="radio" name="background" value="none" />
                  <span class="choice-icon icon-none" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 5l14 14M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/></svg>
                  </span>
                  <span><b>无</b><small>仅内容</small></span>
                </label>
                <label class="choice-card">
                  <input type="radio" name="background" value="plain" />
                  <span class="choice-icon icon-plain" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
                  </span>
                  <span><b>纯色</b><small>干净克制</small></span>
                </label>
                <label class="choice-card">
                  <input type="radio" name="background" value="soft" />
                  <span class="choice-icon icon-soft" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="5"/><circle cx="16" cy="16" r="5"/></svg>
                  </span>
                  <span><b>柔和</b><small>强调色光晕</small></span>
                </label>
              </div>
            </section>
          </div>
        </aside>
      </main>
    </div>

    <div class="modal-backdrop" id="settings-modal" hidden>
      <section
        class="settings-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-dialog-title"
      >
        <header class="dialog-header">
          <div>
            <h2 id="settings-dialog-title">快捷键设置</h2>
            <p>复制文字后，可直接生成图片到剪贴板</p>
          </div>
          <button
            class="icon-button"
            id="close-settings"
            type="button"
            aria-label="关闭设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>
        </header>
        <div class="dialog-body">
          <label class="switch-row">
            <span>
              <b>启用全局快捷键</b>
              <small>关闭后不会监听系统按键</small>
            </span>
            <input id="shortcut-enabled" type="checkbox" role="switch" />
          </label>
          <div class="shortcut-editor">
            <label class="field">
              <span>快捷键</span>
              <input id="accelerator" type="text" readonly />
            </label>
            <button class="button button-primary" id="apply-shortcut" type="button">
              应用
            </button>
          </div>
          <p id="shortcut-help" class="help">
            点击输入框后按下新的组合键。
          </p>
          <p id="shortcut-error" class="field-error" role="alert"></p>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
